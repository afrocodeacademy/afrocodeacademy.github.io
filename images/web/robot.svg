<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="A friendly robot waving">
  <style>
    .bob { animation: bob 3.2s ease-in-out infinite; }
    .wave { transform-box: fill-box; transform-origin: 0% 100%; animation: wave 1.6s ease-in-out infinite; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
    .spin-rev { transform-box: fill-box; transform-origin: center; animation: spin 7s linear infinite reverse; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
    .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.4s ease-in-out infinite; }
    .t2 { animation-delay: .8s; } .t3 { animation-delay: 1.6s; }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes wave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-18deg); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: .9; transform: scale(1.5); } }
    @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- circuit traces -->
  <g fill="none" stroke="#f4b13a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".35">
    <path d="M20 370h70l20-20h40"/>
    <path d="M460 370h-70l-20-20h-40"/>
    <path d="M30 200h40l20 20v40"/>
  </g>
  <g fill="#f4b13a" opacity=".6">
    <circle cx="20" cy="370" r="5"/><circle cx="460" cy="370" r="5"/><circle cx="30" cy="200" r="5"/>
  </g>

  <!-- gears -->
  <g class="spin" transform="translate(70 90)">
    <circle r="26" fill="none" stroke="#1c7657" stroke-width="12" stroke-dasharray="8.2 5.4"/>
    <circle r="21" fill="#1c7657"/><circle r="8" fill="#17120e"/>
  </g>
  <g class="spin-rev" transform="translate(112 132)">
    <circle r="15" fill="none" stroke="#7a2e5f" stroke-width="9" stroke-dasharray="6 4"/>
    <circle r="12" fill="#7a2e5f"/><circle r="5" fill="#17120e"/>
  </g>

  <!-- speech bubble -->
  <g class="float">
    <path d="M356 34h92a18 18 0 0 1 18 18v28a18 18 0 0 1-18 18h-58l-22 20 4-20h-16a18 18 0 0 1-18-18V52a18 18 0 0 1 18-18z" fill="#f4b13a"/>
    <text x="402" y="76" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#17120e">&lt;/&gt;</text>
  </g>

  <!-- sparkles -->
  <g fill="#fbf6ee">
    <path class="twinkle" d="M40 290l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/>
    <path class="twinkle t2" d="M430 190l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path class="twinkle t3" d="M180 30l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
    <path class="twinkle t2" d="M320 20l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
  </g>

  <!-- shadow -->
  <ellipse cx="240" cy="372" rx="118" ry="14" fill="#000" opacity=".35"/>

  <!-- tracks -->
  <rect x="148" y="304" width="184" height="52" rx="26" fill="#3b332c"/>
  <g class="spin"><circle cx="176" cy="330" r="17" fill="#17120e" stroke="#f4b13a" stroke-width="4" stroke-dasharray="6 5"/></g>
  <g class="spin"><circle cx="240" cy="330" r="14" fill="#17120e" stroke="#f4b13a" stroke-width="4" stroke-dasharray="6 5"/></g>
  <g class="spin"><circle cx="304" cy="330" r="17" fill="#17120e" stroke="#f4b13a" stroke-width="4" stroke-dasharray="6 5"/></g>

  <g class="bob">
    <!-- left arm -->
    <path d="M166 210c-30 10-46 30-52 56" fill="none" stroke="#cfc4b7" stroke-width="14" stroke-linecap="round"/>
    <circle cx="112" cy="272" r="14" fill="#1c7657"/>
    <!-- right arm (waving) -->
    <g class="wave">
      <path d="M314 208c26-12 42-34 48-62" fill="none" stroke="#cfc4b7" stroke-width="14" stroke-linecap="round"/>
      <circle cx="364" cy="140" r="14" fill="#1c7657"/>
    </g>

    <!-- body -->
    <rect x="224" y="150" width="32" height="24" rx="6" fill="#cfc4b7"/>
    <rect x="158" y="168" width="164" height="134" rx="30" fill="#d4502a"/>
    <rect x="158" y="268" width="164" height="34" rx="0" fill="#b3401d" opacity=".35"/>
    <rect x="184" y="192" width="112" height="66" rx="14" fill="#fbf6ee"/>
    <rect x="198" y="206" width="46" height="8" rx="4" fill="#d4502a"/>
    <rect x="198" y="222" width="70" height="8" rx="4" fill="#1c7657"/>
    <rect x="198" y="238" width="34" height="8" rx="4" fill="#f4b13a"/>
    <rect x="238" y="238" width="30" height="8" rx="4" fill="#7a2e5f"/>
    <circle cx="198" cy="284" r="7" fill="#f4b13a"/>
    <circle cx="220" cy="284" r="7" fill="#fbf6ee"/>
    <rect x="252" y="279" width="48" height="10" rx="5" fill="#17120e" opacity=".5"/>

    <!-- ears -->
    <rect x="148" y="92" width="20" height="38" rx="8" fill="#1c7657"/>
    <rect x="312" y="92" width="20" height="38" rx="8" fill="#1c7657"/>

    <!-- antenna -->
    <path d="M240 58V30" stroke="#cfc4b7" stroke-width="6" stroke-linecap="round"/>
    <circle class="pulse" cx="240" cy="24" r="16" fill="#f4b13a"/>
    <circle cx="240" cy="24" r="10" fill="#f4b13a"/>

    <!-- head -->
    <rect x="162" y="56" width="156" height="104" rx="36" fill="#fbf6ee"/>
    <rect x="182" y="76" width="116" height="64" rx="22" fill="#17120e"/>
    <g class="blink">
      <rect x="206" y="92" width="18" height="22" rx="9" fill="#f4b13a"/>
      <rect x="256" y="92" width="18" height="22" rx="9" fill="#f4b13a"/>
    </g>
    <path d="M222 124q18 12 36 0" fill="none" stroke="#f4b13a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="196" cy="120" r="6" fill="#d4502a" opacity=".7"/>
    <circle cx="284" cy="120" r="6" fill="#d4502a" opacity=".7"/>
  </g>
</svg>
